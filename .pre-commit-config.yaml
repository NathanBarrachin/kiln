# Contrôles de kiln rejoués par git, comme dans les repos générés.
#
# Installation, une fois, à la racine : kiln install  (ou : uvx pre-commit install)
# Le crochet vaut pour l'arbre principal et tous les worktrees. Tout rejouer :
#   pre-commit run --all-files --hook-stage pre-push
# Le typage, trop lent pour chaque commit, se joue avant chaque push : `develop` ne reçoit la
# CI complète qu'au passage d'une version (skill `base:version`).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]

      - id: typage
        name: typage mypy (avant push)
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
