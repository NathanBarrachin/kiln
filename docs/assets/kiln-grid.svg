<svg xmlns="http://www.w3.org/2000/svg" width="867" height="328" viewBox="0 0 867 328" role="img" aria-label="kiln grid: the rules kiln stands behind">
<rect width="100%" height="100%" rx="10" fill="#1c1b19"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#e6e3dc" xml:space="preserve">
<text x="22.0" y="41.5" textLength="8.4" fill="#8c8c87">$</text>
<text x="38.8" y="41.5" textLength="75.6">kiln grid</text>
<text x="38.8" y="77.5" textLength="100.8" fill="#f79628" font-weight="bold">APP-SECURITY</text>
<text x="55.6" y="95.5" textLength="117.6">NO-TRACKED-ENV</text>
<text x="232.0" y="95.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="299.2" y="95.5" textLength="352.8">No environment file with secrets committed</text>
<text x="38.8" y="131.5" textLength="100.8" fill="#f79628" font-weight="bold">SUPPLY-CHAIN</text>
<text x="55.6" y="149.5" textLength="151.2">DEPENDENCY-UPDATES</text>
<text x="232.0" y="149.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="299.2" y="149.5" textLength="445.2">Dependency updates proposed by Dependabot or Renovate</text>
<text x="55.6" y="167.5" textLength="159.6">LOCKED-DEPENDENCIES</text>
<text x="232.0" y="167.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="299.2" y="167.5" textLength="529.2">Every dependency manifest has its lockfile committed next to it</text>
<text x="55.6" y="185.5" textLength="117.6">PINNED-ACTIONS</text>
<text x="232.0" y="185.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="299.2" y="185.5" textLength="546.0">GitHub Actions and reusable workflows pinned to a full commit SHA</text>
<text x="55.6" y="203.5" textLength="126.0">UPDATE-COOLDOWN</text>
<text x="232.0" y="203.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="299.2" y="203.5" textLength="537.6">New dependency versions wait a few days before they are proposed</text>
<text x="38.8" y="239.5" textLength="84.0" fill="#f79628" font-weight="bold">CONTAINERS</text>
<text x="55.6" y="257.5" textLength="159.6">NON-ROOT-CONTAINERS</text>
<text x="232.0" y="257.5" textLength="42.0" fill="#82be6e">adopt</text>
<text x="299.2" y="257.5" textLength="352.8">Container images switch to a non-root user</text>
<text x="38.8" y="293.5" textLength="344.4">6 rules, 6 scored (adopt). kiln grid &lt;ID&gt;</text>
<text x="38.8" y="311.5" textLength="436.8" fill="#8c8c87">105 more, assessed or held: kiln grid --level assess</text>
</g>
